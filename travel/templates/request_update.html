{% extends 'base.html' %}
{% load static %}
{% block title %}Edit request{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'travel/request_form.css' %}">
<div class="req-page">
<section class="req-section">
<div class="req-card">
<a href="{% url 'request_list' %}" class="req-back">&larr; Back to companion requests</a>
<p class="req-label">Edit request</p>
<h1>Update your request</h1>
<p class="req-subtitle">Change any detail below and save.</p>
{% if error %}
<p class="req-error">{{ error }}</p>
{% endif %}
<form method="POST">
{% csrf_token %}
<div class="req-row">
<div class="req-field">
<label>Start location</label>
<input type="text" name="start_location" maxlength="100" value="{{ request.start_location }}" required>
</div>
<div class="req-field">
<label>End location</label>
<input type="text" name="end_location" maxlength="100" value="{{ request.end_location }}" required>
</div>
</div>
<div class="req-field">
<label>Date and time</label>
<input type="datetime-local" name="date" value="{{ request.date|date:'Y-m-d\TH:i' }}" required>
</div>
<div class="req-field">
<label>Description</label>
<textarea name="description" rows="5">{{ request.description|default_if_none:"" }}</textarea>
</div>
<div class="req-buttons">
<button type="submit" class="req-btn-dark">Save Changes</button>
<a href="{% url 'request_list' %}" class="req-btn-light">Cancel</a>
</div>
</form>
</div>
</section>
</div>
{% endblock %}
